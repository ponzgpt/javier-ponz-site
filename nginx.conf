server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  # Security headers. nginx drops these inherited add_header lines inside any location that sets its own
  # add_header, so every such location below repeats them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  error_page 404 /404.html;
  # HTML must revalidate: without this, browsers keep showing the previous page after a deploy.
  # `expires` (not add_header) so the security headers above still apply here.
  location / { expires -1; try_files $uri $uri/ =404; }
  # v4 and v5 were briefly live as /v/sketch-a/ and /v/sketch-c/. Relative Location, so TLS at the proxy is kept.
  location = /v/sketch-a { absolute_redirect off; return 301 /v/v4/; }
  location = /v/sketch-c { absolute_redirect off; return 301 /v/v5/; }
  location ^~ /v/sketch-a/ { absolute_redirect off; rewrite ^/v/sketch-a/(.*)$ /v/v4/$1 permanent; }
  location ^~ /v/sketch-c/ { absolute_redirect off; rewrite ^/v/sketch-c/(.*)$ /v/v5/$1 permanent; }
  # The CV opens in the browser, never as a download, and revalidates like HTML: it changes between deploys.
  # The old filename carried a second surname; keep it alive for links already sent.
  location = /javier-ponz-prado-cv.pdf { absolute_redirect off; return 301 /javier-ponz-cv.pdf; }
  location = /javier-ponz-cv.pdf {
    types { application/pdf pdf; }
    expires -1;
    add_header Content-Disposition 'inline; filename="javier-ponz-cv.pdf"' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  # Only Astro's hashed assets are immutable. Everything else in public/ (og.jpg, favicons) keeps its
  # name across versions, so it must revalidate: an immutable og.jpg kept old link previews alive.
  location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2|ico)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
}
