<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JP">
  <!-- JP in the Omakase palette: Tokyo Night ground, accent blue, accent green.
       Drawn as rects rather than <text> so it renders identically everywhere,
       with no dependency on a monospace font being available. -->
  <rect width="64" height="64" rx="14" fill="#1a1b26"/>
  <g fill="#7aa2f7">
    <rect x="19" y="16" width="8" height="31"/>
    <rect x="7" y="39" width="20" height="8"/>
    <rect x="7" y="32" width="8" height="8"/>
  </g>
  <g fill="#9ece6a">
    <rect x="33" y="16" width="8" height="31"/>
    <rect x="33" y="16" width="24" height="8"/>
    <rect x="49" y="16" width="8" height="25"/>
    <rect x="33" y="33" width="24" height="8"/>
  </g>
  <rect x="41" y="24" width="8" height="9" fill="#1a1b26"/>
</svg>
